server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/codepilot-intelligence-db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  ai:
    openai: 
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1       # Fixed: Appended /v1
      chat:
        options:
          model: nvidia/nemotron-3-super-120b-a12b:free    # Verified OpenRouter model ID
          temperature: 0.0


logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.ai.openai: DEBUG
    com.openai: DEBUG
    okhttp3: DEBUG
