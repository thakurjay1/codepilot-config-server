server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/codepilot-intelligence-db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  ai:
    openai: 
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1       # Fixed: Appended /v1
      chat:
        options:
          model: google/gemini-3-flash-preview    # Verified OpenRouter model ID
          temperature: 0.0


logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.ai.openai: DEBUG
    com.openai: DEBUG
    okhttp3: DEBUG

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.codepilot-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}
  ai:
    openai: 
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: google/gemini-3-flash-preview
