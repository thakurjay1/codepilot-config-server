server:
  port: 9020
  servlet.context-path: /workspace

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/codepilot-workspace-db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  data: 
    redis: 
      host: localhost
      port: 6379

minio: 
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  project-bucket: projects

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.codepilot-core.svc.cluster.local:5434/workspace-db
    username: workspace-user 
    password: ${DB_PASSWORD}
  data: 
    redis: 
      host: redis.codepilot-core.svc.cluster.local
      port: 6379

minio: 
  url: http://minio.codepilot-core.svc.cluster.local:9000
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD
  project-bucket: projects